# YESI-WMS web tier (Nginx 1.27, container port 8080).
#
# nginx `add_header` inheritance is per-level: any location that declares its
# own `add_header` stops inheriting the server-level ones, so the security set
# is repeated inside those locations on purpose. Keep the three blocks in sync.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA bundles + PDFs are large; compress text payloads.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────
    # CSP notes:
    #  - style-src keeps 'unsafe-inline': the boot splash in index.html and the
    #    animation library both emit inline style attributes.
    #  - connect-src allows the Supabase project REST/Realtime endpoints only.
    #  - worker-src allows blob: so the compute worker survives dev-mode and
    #    bundler fallbacks while still being same-origin in production.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    # Browsers ignore HSTS delivered over plain HTTP, so this is inert on the
    # container's :8080 listener and becomes effective the moment TLS is
    # terminated in front of it. `preload` is deliberately NOT set: it is
    # irreversible for a whole domain.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # The service worker must never be cached, or a stale shell survives a deploy.
    location = /sw.js {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store";
        return 200 '{"status":"healthy","service":"yesi-wms-web"}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
