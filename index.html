<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- iOS / mobile viewport: cover notch + home indicator; prevent unwanted zoom on inputs -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="YESI Lite WMS — Instant fulfillment warehouse app. Offline-first, installable on iPhone & iPad." />

    <!-- iOS home-screen / standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YESI Lite" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="YESI Lite WMS" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Prevent iOS callout on long-press for warehouse floor use -->
    <meta name="apple-touch-fullscreen" content="yes" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./apple-touch-icon-167.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <title>Yesi-WMS Lite</title>
    <style>
      /* Instant paint before React hydrates — matches void theme */
      html, body, #root {
        height: 100%;
        margin: 0;
        background: #0a0a0a;
        color: #f5f5f5;
      }
      /* Safe areas for notched iPhones when CSS not yet loaded */
      body {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
